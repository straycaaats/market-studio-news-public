name: Update 60-second news
on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-studio-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check update-news.mjs
      - run: npm run update
      - name: Preserve NEWS MEMORY
        run: |
          git config user.name "market-studio-news-bot"
          git config user.email "market-studio-news-bot@users.noreply.github.com"
          git add data/news-memory.json public
          git diff --cached --quiet || git commit -m "news: update $(date -u +%FT%TZ)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
